<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#020105">
<title>NEXUS — Private Intelligence</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="#"><img src="assets/nexus-logo.jpg" alt="NEXUS"></a>
    <button class="menu" aria-label="Menu"><i></i><i></i><i></i></button>
  </header>

  <main>
    <section class="welcome">
      <div class="eyebrow">PRIVATE INTELLIGENCE</div>
      <h1>WELCOME TO <em>NEXUS</em></h1>
      <p>Your thoughts, given a sharper edge.</p>
    </section>

    <section class="composer-area">
      <h2>HOW CAN I HELP YOU TODAY</h2>
      <form class="composer">
        <input type="text" placeholder="Begin a conversation..." aria-label="Message">
        <div class="actions">
          <button type="button" aria-label="Microphone">
            <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6"/></svg>
          </button>
          <button type="button" aria-label="Gallery">
            <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m5.5 17 4.2-4.2 3.2 3.1 2.1-2.1 3.5 3.2"/></svg>
          </button>
        </div>
      </form>
      <div class="disclaimer">NEXUS AI CAN MAKE MISTAKES. CHECK IMPORTANT INFO.</div>
    </section>
  </main>

  <div class="orb"></div>
</div>
<script src="script.js"></script>
</body>
</html>
